<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hangout</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a2440; font-family: ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif; }
  canvas { display: block; touch-action: none; }
  .glass { background: rgba(255,255,255,.16); backdrop-filter: blur(16px) saturate(160%); -webkit-backdrop-filter: blur(16px) saturate(160%); border: 1px solid rgba(255,255,255,.22); color: #fff; }
  #here { position: fixed; top: max(14px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px; font-size: 14px; font-weight: 600; display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  #here .dot { width: 8px; height: 8px; border-radius: 50%; background: #7ee0b8; box-shadow: 0 0 10px #7ee0b8; }
  #emotes { position: fixed; bottom: max(16px, env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%); display: flex; gap: 6px; padding: 6px; border-radius: 999px; }
  @media (max-width: 560px) { #emotes { left: max(12px, env(safe-area-inset-left)); transform: none; } #hint { left: max(12px, env(safe-area-inset-left)); transform: none; } #emotes button { width: 42px; height: 42px; } }
  #emotes button { width: 46px; height: 46px; border-radius: 50%; border: 0; background: transparent; font-size: 22px; cursor: pointer; transition: transform .15s; }
  #emotes button:hover, #emotes button:active { transform: scale(1.18); background: rgba(255,255,255,.14); }
  #hint { position: fixed; bottom: calc(max(16px, env(safe-area-inset-bottom)) + 70px); left: 50%; transform: translateX(-50%); padding: 7px 13px; border-radius: 999px; font-size: 13px; transition: opacity 1s; white-space: nowrap; }
  #tags { position: fixed; inset: 0; pointer-events: none; }
  .tag { position: absolute; transform: translate(-50%, -100%); padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #fff; background: rgba(20,16,40,.45); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); white-space: nowrap; }
  .emote { position: absolute; transform: translate(-50%, -100%); font-size: 30px; pointer-events: none; animation: rise 2.2s ease-out forwards; }
  @keyframes rise { 0% { opacity: 0; margin-top: 0; transform: translate(-50%, -100%) scale(.6); } 15% { opacity: 1; transform: translate(-50%, -100%) scale(1.15); } 100% { opacity: 0; margin-top: -60px; transform: translate(-50%, -100%) scale(1); } }
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"}}</script>
</head>
<body>
<div id="here" class="glass"><span class="dot"></span><span id="count">Just you here</span></div>
<div id="hint" class="glass">WASD or tap the ground to move · say hi below</div>
<div id="tags"></div>
<div id="emotes" class="glass">
  <button data-e="👋" aria-label="Wave">👋</button>
  <button data-e="❤️" aria-label="Heart">❤️</button>
  <button data-e="✨" aria-label="Sparkle">✨</button>
  <button data-e="😂" aria-label="Laugh">😂</button>
  <button data-e="🎉" aria-label="Party">🎉</button>
</div>
<script type="module">
import * as THREE from 'three';

// === CONFIG ===
const CONFIG = {
  sky: { top: '#2b2552', horizon: '#e9b0b9' },
  ground: '#7d9b78', path: '#e4cfb2',
  plazaRadius: 16,
  speed: 5.5,
  lanterns: 10, trees: 22, fireflies: 120,
  sendRate: 5, // position updates per second (the room paces them further in big crowds)
};

const orb = window.orb;
const me = orb?.me ?? { id: 'me', name: 'You', color: '#8b7bff' };

// === SCENE ===
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(CONFIG.sky.horizon, 30, 90);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 200);

// Soft round dot for stars and fireflies (points are square without a texture).
const dot = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const g = c.getContext('2d'), grd = g.createRadialGradient(32, 32, 0, 32, 32, 32);
  grd.addColorStop(0, 'rgba(255,255,255,1)'); grd.addColorStop(0.35, 'rgba(255,255,255,.6)'); grd.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = grd; g.fillRect(0, 0, 64, 64);
  return new THREE.CanvasTexture(c);
})();

// === SKY & LIGHT ===
const sky = new THREE.Mesh(new THREE.SphereGeometry(120, 32, 16), new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: { top: { value: new THREE.Color(CONFIG.sky.top) }, horizon: { value: new THREE.Color(CONFIG.sky.horizon) } },
  vertexShader: 'varying vec3 vP; void main(){ vP = normalize(position); gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.); }',
  fragmentShader: 'uniform vec3 top; uniform vec3 horizon; varying vec3 vP; void main(){ float h = smoothstep(-0.05, 0.6, vP.y); gl_FragColor = vec4(mix(horizon, top, h), 1.); }',
}));
scene.add(sky);
const starGeo = new THREE.BufferGeometry();
const starPos = new Float32Array(600 * 3);
for (let i = 0; i < 600; i++) {
  const v = new THREE.Vector3().randomDirection(); v.y = Math.abs(v.y) * 0.9 + 0.1; v.normalize().multiplyScalar(110);
  starPos.set([v.x, v.y, v.z], i * 3);
}
starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: '#fff7e6', size: 1.4, map: dot, fog: false, transparent: true, opacity: 0.9, depthWrite: false })));

scene.add(new THREE.HemisphereLight('#c9bfff', '#6a5a70', 1.5));
const moon = new THREE.DirectionalLight('#ffe2c4', 1.6);
moon.position.set(-14, 22, 10); moon.castShadow = true;
moon.shadow.mapSize.set(2048, 2048);
Object.assign(moon.shadow.camera, { left: -22, right: 22, top: 22, bottom: -22, near: 1, far: 60 });
scene.add(moon);

// === WORLD ===
const ground = new THREE.Mesh(new THREE.CircleGeometry(60, 64), new THREE.MeshStandardMaterial({ color: CONFIG.ground, roughness: 0.95 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const plaza = new THREE.Mesh(new THREE.CircleGeometry(CONFIG.plazaRadius, 64), new THREE.MeshStandardMaterial({ color: CONFIG.path, roughness: 0.9 }));
plaza.rotation.x = -Math.PI / 2; plaza.position.y = 0.01; plaza.receiveShadow = true; scene.add(plaza);
for (let r = 4; r < CONFIG.plazaRadius; r += 4) {
  const ring = new THREE.Mesh(new THREE.RingGeometry(r - 0.05, r + 0.05, 96), new THREE.MeshStandardMaterial({ color: '#c2a988', roughness: 1 }));
  ring.rotation.x = -Math.PI / 2; ring.position.y = 0.015; scene.add(ring);
}

// Fountain
const stone = new THREE.MeshStandardMaterial({ color: '#cfc4d8', roughness: 0.7, flatShading: true });
const basin = new THREE.Mesh(new THREE.CylinderGeometry(2.4, 2.6, 0.7, 24), stone); basin.position.y = 0.35; basin.castShadow = basin.receiveShadow = true; scene.add(basin);
const water = new THREE.Mesh(new THREE.CircleGeometry(2.2, 32), new THREE.MeshStandardMaterial({ color: '#7fd4ff', emissive: '#3aa4e6', emissiveIntensity: 0.5, roughness: 0.2 }));
water.rotation.x = -Math.PI / 2; water.position.y = 0.66; scene.add(water);
const pillar = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.5, 1.8, 12), stone); pillar.position.y = 1.2; pillar.castShadow = true; scene.add(pillar);
const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(0.55), new THREE.MeshStandardMaterial({ color: '#c9b8ff', emissive: '#8b7bff', emissiveIntensity: 1.4, flatShading: true }));
crystal.position.y = 2.7; scene.add(crystal);
const crystalLight = new THREE.PointLight('#b9a8ff', 14, 14, 2); crystalLight.position.y = 2.7; scene.add(crystalLight);

// Lanterns around the plaza
const lanternGlow = new THREE.MeshStandardMaterial({ color: '#ffd59a', emissive: '#ffb45c', emissiveIntensity: 2.2 });
const post = new THREE.MeshStandardMaterial({ color: '#4b4058', roughness: 0.8 });
for (let i = 0; i < CONFIG.lanterns; i++) {
  const a = (i / CONFIG.lanterns) * Math.PI * 2, r = CONFIG.plazaRadius + 0.6;
  const g = new THREE.Group();
  const p = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.1, 2.6, 8), post); p.position.y = 1.3; p.castShadow = true;
  const l = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 12), lanternGlow); l.position.y = 2.75;
  g.add(p, l); g.position.set(Math.cos(a) * r, 0, Math.sin(a) * r); scene.add(g);
  if (i % 2 === 0) { const pl = new THREE.PointLight('#ffb45c', 6, 9, 2); pl.position.set(g.position.x, 2.7, g.position.z); scene.add(pl); }
}

// Trees (instanced)
const trunkGeo = new THREE.CylinderGeometry(0.15, 0.22, 1.6, 6).translate(0, 0.8, 0);
const crownGeo = new THREE.IcosahedronGeometry(1.2, 0).translate(0, 2.3, 0);
const trunks = new THREE.InstancedMesh(trunkGeo, new THREE.MeshStandardMaterial({ color: '#5c4a46', flatShading: true }), CONFIG.trees);
const crowns = new THREE.InstancedMesh(crownGeo, new THREE.MeshStandardMaterial({ color: '#6f9e78', flatShading: true }), CONFIG.trees);
trunks.castShadow = crowns.castShadow = true;
const m4 = new THREE.Matrix4(), col = new THREE.Color();
for (let i = 0; i < CONFIG.trees; i++) {
  const a = (i / CONFIG.trees) * Math.PI * 2 + Math.random() * 0.2, r = CONFIG.plazaRadius + 5 + Math.random() * 9, s = 0.8 + Math.random() * 0.7;
  m4.compose(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r), new THREE.Quaternion().setFromEuler(new THREE.Euler(0, Math.random() * 6, 0)), new THREE.Vector3(s, s, s));
  trunks.setMatrixAt(i, m4); crowns.setMatrixAt(i, m4);
  crowns.setColorAt(i, col.set('#6f9e78').offsetHSL((Math.random() - 0.5) * 0.06, 0, (Math.random() - 0.5) * 0.08));
}
scene.add(trunks, crowns);

// Fireflies
const ffGeo = new THREE.BufferGeometry();
const ffPos = new Float32Array(CONFIG.fireflies * 3), ffSeed = new Float32Array(CONFIG.fireflies);
for (let i = 0; i < CONFIG.fireflies; i++) {
  const a = Math.random() * Math.PI * 2, r = 3 + Math.random() * 26;
  ffPos.set([Math.cos(a) * r, 0.5 + Math.random() * 3, Math.sin(a) * r], i * 3); ffSeed[i] = Math.random() * 100;
}
ffGeo.setAttribute('position', new THREE.BufferAttribute(ffPos, 3));
const fireflies = new THREE.Points(ffGeo, new THREE.PointsMaterial({ color: '#fff1a8', size: 0.45, map: dot, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false }));
scene.add(fireflies);

// === PLAYER / CONTROLS ===
// Every person is a little glowing orb with eyes and a name tag.
const tagsEl = document.getElementById('tags');
function makeAvatar(color, name) {
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.SphereGeometry(0.55, 32, 24), new THREE.MeshStandardMaterial({ color, emissive: color, emissiveIntensity: 0.55, roughness: 0.35 }));
  body.castShadow = true; body.position.y = 1;
  const eyeMat = new THREE.MeshBasicMaterial({ color: '#1a1530' });
  for (const x of [-0.17, 0.17]) { const e = new THREE.Mesh(new THREE.SphereGeometry(0.07, 12, 8), eyeMat); e.position.set(x, 1.08, 0.5); g.add(e); }
  const glow = new THREE.PointLight(color, 3, 4, 2); glow.position.y = 1;
  const shadow = new THREE.Mesh(new THREE.CircleGeometry(0.5, 24), new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.25 }));
  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02;
  g.add(body, glow, shadow);
  const tag = document.createElement('div'); tag.className = 'tag'; tag.textContent = name; tag.style.borderBottom = `2px solid ${color}`;
  tagsEl.appendChild(tag);
  scene.add(g);
  return { group: g, body, tag, target: new THREE.Vector3(), heading: 0, phase: Math.random() * 6 };
}

const self = makeAvatar(me.color, me.name);
const spawnA = Math.random() * Math.PI * 2;
self.group.position.set(Math.cos(spawnA) * 3.2, 0, 5.5 + Math.sin(spawnA) * 1.5); // in front of the fountain
self.target.copy(self.group.position);

const keys = new Set();
addEventListener('keydown', (e) => { if (!e.target.closest?.('input')) keys.add(e.code); });
addEventListener('keyup', (e) => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

// Tap / click the ground to walk there.
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let walkTo = null;
renderer.domElement.addEventListener('pointerdown', (e) => {
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObject(ground)[0];
  if (hit) walkTo = hit.point.setY(0);
});

const camOffset = new THREE.Vector3(0, 5.2, 13.5);

// === MULTIPLAYER ===
const others = new Map(); // peerId → avatar
let selfPeerId = null;
function upsertPeer(peer) {
  if (!peer || peer.id === selfPeerId) return;
  let a = others.get(peer.id);
  if (!a) {
    a = makeAvatar(peer.color || '#a0a8ff', peer.name || 'Guest');
    others.set(peer.id, a);
    if (peer.state?.x != null) a.group.position.set(peer.state.x, 0, peer.state.z);
  }
  if (peer.state && typeof peer.state.x === 'number') { a.target.set(peer.state.x, 0, peer.state.z); a.heading = peer.state.h || 0; }
}
function removePeer(peer) {
  const a = peer && others.get(peer.id);
  if (!a) return;
  scene.remove(a.group); a.tag.remove(); others.delete(peer.id);
}
function updateCount() {
  const n = others.size + 1;
  document.getElementById('count').textContent = n === 1 ? 'Just you here · share the link to hang out' : `${n} here`;
}
function showEmote(avatar, emoji) {
  const el = document.createElement('div'); el.className = 'emote'; el.textContent = emoji;
  tagsEl.appendChild(el); avatar.emoteEl = el; setTimeout(() => el.remove(), 2300);
}

const room = orb?.room?.join((e) => {
  if (e.type === 'joined') { selfPeerId = e.self?.id ?? null; (e.peers || []).forEach(upsertPeer); }
  else if (e.type === 'join' || e.type === 'state') upsertPeer(e.peer);
  else if (e.type === 'leave') removePeer(e.peer);
  else if (e.type === 'message' && e.data?.emote) { upsertPeer(e.peer); const a = others.get(e.peer.id); if (a) showEmote(a, String(e.data.emote).slice(0, 4)); }
  updateCount();
});
updateCount();

// === UI ===
document.querySelectorAll('#emotes button').forEach((b) => b.addEventListener('click', () => {
  const emote = b.dataset.e;
  showEmote(self, emote);
  room?.send({ emote });
}));
const hint = document.getElementById('hint');
if (matchMedia('(pointer: coarse)').matches && !matchMedia('(any-pointer: fine)').matches) hint.textContent = 'Tap the ground to walk · say hi below';
setTimeout(() => (hint.style.opacity = 0), 6000);
setTimeout(() => orb?.capture?.(), 3000);

// === LOOP ===
const timer = new THREE.Timer();
camera.position.copy(self.group.position).add(camOffset);
const v3 = new THREE.Vector3(), forward = new THREE.Vector3();
let sendAcc = 0, lastSent = '';
function placeTag(a, extraY = 1.85) {
  v3.copy(a.group.position).setY(extraY).project(camera);
  const x = (v3.x * 0.5 + 0.5) * innerWidth, y = (-v3.y * 0.5 + 0.5) * innerHeight;
  const visible = v3.z < 1;
  a.tag.style.display = visible ? '' : 'none';
  a.tag.style.left = `${x}px`; a.tag.style.top = `${y}px`;
  if (a.emoteEl) { a.emoteEl.style.left = `${x}px`; a.emoteEl.style.top = `${y - 26}px`; }
}

renderer.setAnimationLoop((t) => {
  timer.update(t);
  const dt = Math.min(Math.max(timer.getDelta(), 0), 0.05), time = timer.getElapsed();

  // Movement: keys move relative to the camera; a tap sets a destination.
  const ix = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  const iz = (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0) - (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0);
  const p = self.group.position;
  if (ix || iz) { walkTo = null; forward.set(ix, 0, iz).normalize().multiplyScalar(CONFIG.speed * dt); p.add(forward); self.heading = Math.atan2(ix, iz); }
  else if (walkTo) {
    forward.subVectors(walkTo, p); const d = forward.length();
    if (d < 0.1) walkTo = null; else { forward.multiplyScalar(Math.min(1, (CONFIG.speed * dt) / d)); p.add(forward); self.heading = Math.atan2(forward.x, forward.z); }
  }
  // Stay in the meadow; walk around the fountain.
  const r = Math.hypot(p.x, p.z);
  if (r > 27) p.multiplyScalar(27 / r);
  if (r < 3) p.multiplyScalar(3 / Math.max(r, 0.001));
  self.group.rotation.y += (self.heading - self.group.rotation.y) * Math.min(1, dt * 8);

  // Bob everyone gently; ease others toward their latest position.
  self.body.position.y = 1 + Math.sin(time * 3 + self.phase) * 0.08;
  for (const a of others.values()) {
    a.group.position.lerp(a.target, Math.min(1, dt * 8));
    a.group.rotation.y += (a.heading - a.group.rotation.y) * Math.min(1, dt * 6);
    a.body.position.y = 1 + Math.sin(time * 3 + a.phase) * 0.08;
  }

  // Share where I am (throttled, only when it changed).
  sendAcc += dt;
  if (room && sendAcc > 1 / CONFIG.sendRate) {
    sendAcc = 0;
    const s = `${p.x.toFixed(2)},${p.z.toFixed(2)},${self.heading.toFixed(2)}`;
    if (s !== lastSent) { lastSent = s; room.setState({ x: +p.x.toFixed(2), z: +p.z.toFixed(2), h: +self.heading.toFixed(2) }); }
  }

  // Life: crystal, water shimmer, fireflies.
  crystal.rotation.y += dt * 0.8; crystal.position.y = 2.7 + Math.sin(time * 1.5) * 0.15;
  water.material.emissiveIntensity = 0.45 + Math.sin(time * 2) * 0.1;
  const pos = ffGeo.attributes.position;
  for (let i = 0; i < CONFIG.fireflies; i++) pos.array[i * 3 + 1] += Math.sin(time * 1.3 + ffSeed[i]) * dt * 0.25;
  pos.needsUpdate = true;
  fireflies.material.opacity = 0.7 + Math.sin(time * 2.4) * 0.2;

  // Camera follows me (starts right behind, no swoop).
  camera.position.lerp(v3.copy(p).add(camOffset), Math.min(1, dt * 3));
  camera.lookAt(p.x, 1.4, p.z - 3);

  renderer.render(scene, camera);
  placeTag(self); for (const a of others.values()) placeTag(a);
});

addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
</script>
</body>
</html>
